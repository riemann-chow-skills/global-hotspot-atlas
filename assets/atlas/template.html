<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__ATLAS_TITLE__</title>
<style>__ATLAS_CSS__</style>
</head>
<body>
<div id="app">

  <header class="hdr">
    <div class="hdr-l">
      <button class="ic-btn rail-toggle" id="btn-rail" type="button" aria-label="事件列表">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h11" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
      </button>
      <div class="brand">
        <svg viewBox="0 0 24 24" class="brand-ico" aria-hidden="true">
          <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
          <ellipse cx="12" cy="12" rx="4.2" ry="9.2" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".75"/>
          <path d="M2.9 12h18.2M4.6 7.2h14.8M4.6 16.8h14.8" stroke="currentColor" stroke-width="1.1" opacity=".6"/>
        </svg>
        <div class="brand-txt">
          <h1>__ATLAS_TITLE__</h1>
          <p id="subtitle">—</p>
        </div>
      </div>
    </div>
    <div class="hdr-r">
      <div class="stats" id="stats"></div>
      <button class="btn btn-ghost" id="btn-story" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.6v12.8L19 12z" fill="currentColor"/></svg>
        <span>导览</span>
      </button>
      <button class="btn btn-ghost" id="btn-graph" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="10" cy="18" r="2.4"/><path d="M8.1 7.1l7.8 .8M7.4 8.2l2 7.6M16.6 10.1l-5 6.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span>关系图谱</span>
        <kbd>G</kbd>
      </button>
    </div>
  </header>

  <aside class="rail">
    <div class="rail-hd">
      <div class="rail-tabs" id="filters"></div>
      <div class="rail-sort">
        <span id="rail-count">—</span>
      </div>
    </div>
    <div class="rail-list" id="list"></div>
    <div class="rail-ft">
      <div class="src-badge" id="sources">—</div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="globe"></canvas>
    <div class="tooltip" id="tooltip"></div>

    <div class="stage-hint" id="hint">拖拽旋转 · 滚轮缩放 · 点击光点查看事件</div>

    <div class="legend" id="legend"></div>
    <div class="scenario-bar" id="scenario-bar"></div>

    <div class="ctrls">
      <button class="ic-btn" id="btn-rotate" type="button" title="自动旋转" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20 4v4.6h-4.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="ic-btn" id="btn-cascade" type="button" title="传导链推演" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="2.2" fill="currentColor" stroke="none"/><circle cx="18" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="18" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.5 11l8.4-4.1M7.5 13l8.4 4.1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="ic-btn" id="btn-blind" type="button" title="报道盲区" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.6 2.4"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="ic-btn" id="btn-reset" type="button" title="重置视角">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.4" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg>
      </button>
      <button class="ic-btn" id="btn-focus" type="button" title="聚焦最热事件">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>

    <div class="blind-card" id="blind-card"></div>

    <section class="panel" id="panel" aria-hidden="true">
      <button class="panel-x" id="panel-x" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
      </button>
      <div class="panel-body" id="panel-body"></div>
    </section>

    <div class="story" id="story">
      <div class="story-hd">
        <span class="story-step" id="story-step">—</span>
        <button class="story-x" id="story-x" type="button" aria-label="结束导览">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" fill="none"/></svg>
        </button>
      </div>
      <p class="story-txt" id="story-txt"></p>
      <div class="story-ft">
        <button class="story-nav" id="story-prev" type="button" aria-label="上一步">‹</button>
        <div class="story-dots" id="story-dots"></div>
        <button class="story-nav" id="story-next" type="button" aria-label="下一步">›</button>
      </div>
      <div class="story-prog"><i id="story-prog"></i></div>
    </div>

    <div class="timeline" id="timeline">
      <button class="tl-btn" id="tl-play" type="button" title="播放时间轴" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.6v12.8L19 12z" fill="currentColor"/></svg>
      </button>
      <div class="tl-track" id="tl-track">
        <div class="tl-rail"></div>
        <div class="tl-fill" id="tl-fill"></div>
        <div class="tl-ticks" id="tl-ticks"></div>
        <div class="tl-handle" id="tl-handle"></div>
      </div>
      <div class="tl-label" id="tl-label">—</div>
      <button class="tl-btn sm" id="tl-all" type="button" title="显示全部事件">全部</button>
    </div>

    <section class="drawer" id="drawer">
      <div class="drawer-bar">
        <div class="drawer-title">
          <span class="dot-live"></span>
          实体关系图谱
          <em id="graph-sub">—</em>
        </div>
        <div class="drawer-tools">
          <div class="rel-legend" id="rel-legend"></div>
          <button class="ic-btn sm" id="btn-relayout" type="button" title="重新布局">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 8-8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 12a8 8 0 0 1-8 8" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".5"/></svg>
          </button>
          <button class="ic-btn sm" id="btn-graph-close" type="button" title="收起">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
          </button>
        </div>
      </div>
      <div class="drawer-canvas">
        <canvas id="graph"></canvas>
        <div class="tooltip" id="gtip"></div>
      </div>
    </section>
  </main>

</div>

<script id="atlas-data" type="application/json">__ATLAS_DATA__</script>
<script id="landmask" type="text/plain">__LANDMASK_B64__</script>
<script>__ATLAS_JS__</script>
</body>
</html>
